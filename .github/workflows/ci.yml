# Runs the test gate (test.yml) on every PR and on every push to dev — the push re-checks the merged
# result of each PR (nothing reaches dev without one: see docs/process/lifecycle.md).
# Only the parts a change touches run (the `changes` job); the rest report as skipped, which counts as
# passing for a required check. Make `changes`, `test / scripts` and `test / app` required status checks
# on dev and main.
name: CI

on:
  pull_request:
    branches:
      - dev
      - main
      - "release/**"
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Any doubt (no usable base commit) runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          app=false
          all=false
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "$PR_BASE...$PR_HEAD") || all=true
          elif git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$PUSH_BEFORE" "$PUSH_HEAD") || all=true
          else
            # A new branch, or a force-push that dropped the old tip: nothing to diff against.
            all=true
          fi

          if [ "$all" = true ]; then
            app=true
          else
            while IFS= read -r f; do
              case "$f" in
                # TODO(stack): list this project's source paths, one case per part (e.g. api/*, app/*, shared/*).
                .github/*) app=true ;;
                app/*) app=true ;;
              esac
            done <<< "$files"
          fi

          echo "app=$app" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    uses: ./.github/workflows/test.yml
    with:
      app: ${{ needs.changes.outputs.app == 'true' }}
